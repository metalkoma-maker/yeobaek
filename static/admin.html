<body><div class="shell"><header><div><a href="/" class="brand">소설여백</a><h1>관리자 페이지</h1></div><a href="/">원고 화면으로</a></header><p class="subtitle">가입자와 저장공간 현황</p><div class="actions"><button id="refresh">새로고침</button><span id="checked" role="status"></span></div><p id="error" role="alert" hidden></p><section class="cards" aria-label="전체 현황"><article><span>전체 회원</span><strong id="members">—</strong></article><article><span>오늘 가입</span><strong id="joinedToday">—</strong></article><article><span>전체 원고</span><strong id="manuscripts">—</strong></article><article><span>전체 원고 데이터</span><strong id="contentBytes">—</strong></article></section><section><h2>회원별 현황</h2><form id="searchForm"><label for="query">이메일 검색</label><input id="query" type="search" maxlength="254" placeholder="이메일 일부 입력"><button>검색</button></form><div class="tableWrap"><table><thead><tr><th scope="col">이메일</th><th scope="col">가입일</th><th scope="col">원고 개수</th><th scope="col">원고 데이터 용량</th></tr></thead><tbody id="rows"></tbody></table></div><p id="noMembers" hidden>검색 결과가 없습니다.</p><div class="pagination"><button id="previous">이전</button><span id="pageInfo"></span><button id="next">다음</button></div><p class="note" id="joinNote"></p><p class="note">원고 데이터 용량은 제목·본문을 UTF-8로 저장할 때의 바이트 수입니다. DB 관리 공간과 백업은 포함하지 않습니다.</p></section><section><h2>서버 저장공간</h2><dl><div><dt>DB와 관련 파일</dt><dd id="databaseBytes">—</dd></div><div><dt>디스크 전체</dt><dd id="diskTotal">—</dd></div><div><dt>디스크 사용</dt><dd id="diskUsed">—</dd></div><div><dt>디스크 남음</dt><dd id="diskFree">—</dd></div></dl><p class="note">디스크 사용량에는 운영체제, 앱, 서버 내 백업 등이 포함됩니다. 구글드라이브 백업 용량은 포함하지 않습니다.</p></section></div><script src="/admin.js?v=20261004-1"></script></body></html>
