name: 모바일 앱 검증
on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'tools/run_mobile_test.py'
      - 'tools/mobile_test_proxy.py'
      - 'tools/start_mobile_preview_tunnel.py'
      - 'tests/test_mobile*.py'
      - '.github/workflows/mobile-checks.yml'
permissions:
  contents: read
concurrency:
  group: mobile-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: 모바일 의존성 설치
        run: npm --prefix mobile ci --ignore-scripts --no-audit --no-fund
      - name: 타입·저장 보호 검증
        run: |
          npm --prefix mobile run typecheck
          npm --prefix mobile test
      - name: iOS 테스트·운영 설정 번들 검증
        env:
          CI: '1'
          EXPO_OFFLINE: '1'
        run: |
          EXPO_PUBLIC_YEOBAEK_MODE=synthetic npm --prefix mobile run export:ios
          EXPO_PUBLIC_YEOBAEK_MODE=production npm --prefix mobile run export:ios
