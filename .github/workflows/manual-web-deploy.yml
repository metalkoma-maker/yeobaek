name: 여백 웹 배포
on:
  push:
    branches: [main]
    paths: ['.github/deploy-request.json']
  workflow_dispatch:
    inputs:
      action:
        description: 'inspect=조회만 / deploy=서버·웹 배포 / rollback=코드 복원 (DB 데이터 유지)'
        type: choice
        options: [inspect, deploy, rollback]
        default: inspect
        required: true
permissions:
  contents: read
concurrency:
  group: yeobaek-production-web
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: 배포 요청 파일만 변경됐는지 확인
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BEFORE" =~ ^[0-9a-f]{40}$ && "$BEFORE" != 0000000000000000000000000000000000000000 ]]
          git fetch --no-tags --depth=1 origin "$BEFORE"
          python3 deploy/validate_deploy_request.py --before "$BEFORE" --commit "$GITHUB_SHA"
      - name: 가짜 데이터 단위 검증
        run: |
          python3 -m venv "$RUNNER_TEMP/test-venv"
          "$RUNNER_TEMP/test-venv/bin/pip" install -r requirements.txt
          "$RUNNER_TEMP/test-venv/bin/python" -m unittest discover -s tests -v
      - name: 브라우저 검증 도구
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tests" --ignore-scripts --no-audit --no-fund playwright@1.56.1
          test -x /usr/bin/google-chrome
      - name: PC·모바일 웹, 내려받기, 원고 정렬 검증 (가짜 API)
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          export NODE_PATH="$RUNNER_TEMP/browser-tests/node_modules"
          node tests/browser_web_input.cjs
          node tests/browser_web_writing.cjs
          node tests/browser_web_features.cjs
          node tests/browser_accounts.cjs
  production:
    needs: verify
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: 운영 반영 직전 main 재확인
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          main_ref=$(git ls-remote --exit-code origin refs/heads/main)
          [[ "$main_ref" == "$GITHUB_SHA"$'\t'refs/heads/main ]]
      - name: 입력과 SSH 설정 검증
        env:
          DEPLOY_ACTION: ${{ github.event_name == 'push' && 'deploy' || inputs.action }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          TS_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          case "$DEPLOY_ACTION" in inspect|deploy|rollback) ;; *) exit 1 ;; esac
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          test -n "$TS_CLIENT_ID"
          test -n "$TS_SECRET"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/yeobaek-key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/yeobaek-known-hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/yeobaek-key" > /dev/null
          ssh-keygen -F "$DEPLOY_HOST" -f "$RUNNER_TEMP/yeobaek-known-hosts" > /dev/null
          # Fail closed: the runner must use a Tailscale IPv4, never public SSH.
          python3 - <<'PY'
          import ipaddress, os
          address = ipaddress.ip_address(os.environ['DEPLOY_HOST'])
          if address not in ipaddress.ip_network('100.64.0.0/10'):
              raise SystemExit('DEPLOY_HOST에는 서버의 Tailscale IPv4를 설정하세요.')
          PY
      - name: 배포 전용 임시 VPN 연결
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:yeobaek-ci
          version: '1.94.2'
          # The official action supplies --accept-routes; do not duplicate it.
          args: --accept-dns=false --ssh=false
          ping: ${{ vars.DEPLOY_HOST }}
          use-cache: 'false'
          log-mode: quiet
      - name: 실행기의 서브넷 경로 수신 끄기
        shell: bash
        run: sudo tailscale set --accept-routes=false
      - name: 수동 작업 실행 (서버에서 백업·건강 확인·실패 복원)
        env:
          DEPLOY_ACTION: ${{ github.event_name == 'push' && 'deploy' || inputs.action }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          remote=(ssh -T -p 22 -i "$RUNNER_TEMP/yeobaek-key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/yeobaek-known-hosts" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 "yeobaek-deploy@$DEPLOY_HOST")
          inspection=$("${remote[@]}" inspect)
          printf '%s\n' "$inspection"
          expected=$(INSPECTION="$inspection" python3 - <<'PY'
          import json, os, re
          report = json.loads(os.environ['INSPECTION'])
          if report.get('capability') != 'code-and-additive-history-account-v1':
              raise SystemExit('서버 배포 도구의 이력·계정 스키마 지원을 먼저 설치해야 합니다.')
          fingerprint = report.get('fingerprint', '')
          if not re.fullmatch(r'[0-9a-f]{64}', fingerprint):
              raise SystemExit('서버 코드 fingerprint가 올바르지 않습니다.')
          print(fingerprint)
          PY
          )
          case "$DEPLOY_ACTION" in
            inspect) ;;
            deploy)
              python3 deploy/build_release.py --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/release.zip"
              "${remote[@]}" "deploy $expected" < "$RUNNER_TEMP/release.zip"
              ;;
            rollback) "${remote[@]}" "rollback $expected" ;;
          esac
      - name: 개인키 임시 파일 제거
        if: always()
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/yeobaek-key" "$RUNNER_TEMP/yeobaek-known-hosts" "$RUNNER_TEMP/release.zip"
