name: 웹 변경 검증
on:
  pull_request:
    paths:
      - 'app.py'
      - 'admin_panel.py'
      - 'static/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'tools/run_web_preview.py'
      - 'tools/start_web_preview.sh'
      - 'tools/start_web_preview_tunnel.py'
      - '.github/workflows/web-feature-checks.yml'
permissions:
  contents: read
concurrency:
  group: web-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: 가짜 데이터 단위 검증
        run: |
          python3 -m venv "$RUNNER_TEMP/test-venv"
          "$RUNNER_TEMP/test-venv/bin/pip" install -r requirements.txt
          "$RUNNER_TEMP/test-venv/bin/python" -m unittest discover -s tests -v
      - name: 브라우저 도구 준비
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tests" --ignore-scripts --no-audit --no-fund playwright@1.56.1
          test -x /usr/bin/google-chrome
      - name: 원고 편집·내려받기·목록 순서 검증
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          export NODE_PATH="$RUNNER_TEMP/browser-tests/node_modules"
          node tests/browser_web_input.cjs
          node tests/browser_web_writing.cjs
          node tests/browser_web_features.cjs
      - name: 실제 가짜 서버 미리보기 검증
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/browser-tests/node_modules"
          CODESPACES=false "$RUNNER_TEMP/test-venv/bin/python" -u tools/run_web_preview.py --port 8001 > "$RUNNER_TEMP/web-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true; wait "$preview_pid" 2>/dev/null || true' EXIT
          "$RUNNER_TEMP/test-venv/bin/python" - <<'PY'
          import json,time,urllib.request,urllib.error
          for attempt in range(40):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8001/__web_preview__', timeout=1) as response:
                      assert json.load(response)['syntheticOnly'] is True
                  break
              except (urllib.error.URLError,TimeoutError):
                  time.sleep(0.25)
          else:
              raise SystemExit('Preview did not start')
          PY
          node tests/browser_web_preview.cjs
      - name: 임시 HTTPS 주소의 로그인·드래그·내려받기 검증
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/browser-tests/node_modules"
          "$RUNNER_TEMP/test-venv/bin/python" -u tools/run_web_preview.py --port 18002 --public-origin https://synthetic-browser.trycloudflare.com > "$RUNNER_TEMP/web-preview-tunnel.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true; wait "$preview_pid" 2>/dev/null || true' EXIT
          "$RUNNER_TEMP/test-venv/bin/python" - <<'PY'
          import time,urllib.request,urllib.error
          for attempt in range(40):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18002/__web_preview__', timeout=1) as response:
                      assert response.status == 200
                  break
              except (urllib.error.URLError,TimeoutError):
                  time.sleep(0.25)
          else:
              raise SystemExit('Preview did not start')
          PY
          PREVIEW_BASE_URL=http://127.0.0.1:18002 PREVIEW_TUNNEL_TEST=1 node tests/browser_web_preview.cjs
