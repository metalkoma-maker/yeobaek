name: 소설여백 아이폰 설치 빌드
on:
  push:
    branches:
      - 'mobile-build/ios-device-*'
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: 운영 API 식별 응답 확인
        run: |
          python3 - <<'PY'
          import json
          from urllib.request import urlopen
          with urlopen('https://yeobaek-write.duckdns.org/__deployment_health__', timeout=15) as response:
              marker = json.load(response)
          if marker != {'api': 'manuscript-order-v1'}:
              raise SystemExit('Production API identity did not match; refusing device build')
          print('Production API identity verified (read-only)')
          PY
      - name: 앱 검사
        run: |
          npm --prefix mobile ci --ignore-scripts --no-audit --no-fund
          npm --prefix mobile run typecheck
          npm --prefix mobile test
          cd mobile
          EXPO_PUBLIC_YEOBAEK_MODE=production CI=1 ./node_modules/.bin/expo export --platform ios
      - name: Apple 서명으로 설치용 빌드
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${EXPO_TOKEN:-}" ]]; then
            echo '::error::EXPO_TOKEN is required for the EAS build.'
            exit 1
          fi
          cd mobile
          npx --yes eas-cli@25.1.1 whoami
          npx --yes eas-cli@25.1.1 build --platform ios --profile production --non-interactive --wait
