name: 소설여백 임시 검토 주소
on:
  pull_request:
    types: [synchronize]
    paths: ['.github/workflows/temporary-brand-preview.yml']
permissions:
  contents: read
jobs:
  preview:
    if: github.event.pull_request.number == 9 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: 가짜 데이터 서버 준비
        run: |
          python3 -m venv "$RUNNER_TEMP/preview-venv"
          "$RUNNER_TEMP/preview-venv/bin/pip" install -r requirements.txt
      - name: 임시 HTTPS 주소와 로그인 확인
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=INT 55m "$RUNNER_TEMP/preview-venv/bin/python" -u tools/start_web_preview_tunnel.py > "$RUNNER_TEMP/brand-preview.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/brand-preview.pid"
          for attempt in {1..120}; do
            if grep -E '^https://[a-z0-9-]+\.trycloudflare\.com/$' "$RUNNER_TEMP/brand-preview.log" > "$RUNNER_TEMP/brand-preview-url.txt"; then
              cat "$RUNNER_TEMP/brand-preview-url.txt"
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/brand-preview.pid")" 2>/dev/null; then
              tail -50 "$RUNNER_TEMP/brand-preview.log"
              exit 1
            fi
            sleep 1
          done
          tail -50 "$RUNNER_TEMP/brand-preview.log"
          exit 1
      - name: 검증된 주소 보관
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-brand-preview-url
          path: ${{ runner.temp }}/brand-preview-url.txt
          retention-days: 1
      - name: 미리보기 유지
        shell: bash
        run: |
          while kill -0 "$(cat "$RUNNER_TEMP/brand-preview.pid")" 2>/dev/null; do
            sleep 10
          done
